[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:scheduler]
command=node /app/wait-for-env.js /app/scheduler.js
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/scheduler.err.log
stdout_logfile=/var/log/scheduler.out.log

[program:dashboard]
command=node /app/wait-for-env.js /app/dashboard/server.js
directory=/app/dashboard
autostart=true
autorestart=true
stderr_logfile=/var/log/dashboard.err.log
stdout_logfile=/var/log/dashboard.out.log
