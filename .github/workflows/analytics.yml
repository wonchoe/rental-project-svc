name: Analytics API

on:
  push:
    branches:
      - main
    paths:
      - "analytics/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image using docker
        run: |
          docker build \
            -t wonchoe/analytics:latest \
            -f analytics/Dockerfile \
            analytics

          docker tag wonchoe/analytics:latest wonchoe/analytics:${{ github.run_number }}

      - name: Push image
        run: |
          docker push wonchoe/analytics:latest
          docker push wonchoe/analytics:${{ github.run_number }}
