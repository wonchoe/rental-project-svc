name: Build and Push Google Photo API

on:
  push:
    branches:
      - main
    paths:
      - "google-photo-api/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Buildx with containerd backend (fixes cache export)
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.17.0
            network=host
            containerd-worker=true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push with registry cache (works on ARM)
        uses: docker/build-push-action@v5
        with:
          context: ./google-photo-api
          file: ./google-photo-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            wonchoe/google-photo-api:latest
            wonchoe/google-photo-api:${{ github.sha }}
          cache-from: type=registry,ref=wonchoe/google-photo-api:buildcache
          cache-to: type=registry,ref=wonchoe/google-photo-api:buildcache,mode=max
