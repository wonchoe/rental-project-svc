name: Build and Push Google Photo API

on:
  push:
    branches:
      - main
    paths:
      - "google-photo-api/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create buildx builder (без кешу так само потрібно)
      - name: Create Buildx builder
        run: |
          docker buildx create --use --name api-builder --driver docker-container
          docker buildx inspect --bootstrap

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (без кешу)
        uses: docker/build-push-action@v5
        with:
          context: ./google-photo-api
          file: ./google-photo-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            wonchoe/google-photo-api:latest
            wonchoe/google-photo-api:${{ github.sha }}
