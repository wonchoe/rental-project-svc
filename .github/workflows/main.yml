name: Build and Push Google Photo API

on:
  push:
    branches:
      - main
    paths:
      - "google-photo-api/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🟢 Buildx with registry cache (NO PULL)
      - name: Build and Push with Cache
        uses: docker/build-push-action@v4
        with:
          context: ./google-photo-api
          file: ./google-photo-api/Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=registry,ref=wonchoe/google-photo-api:buildcache
          cache-to: type=registry,ref=wonchoe/google-photo-api:buildcache,mode=max
          tags: |
            wonchoe/google-photo-api:latest
            wonchoe/google-photo-api:build-${{ github.run_number }}
