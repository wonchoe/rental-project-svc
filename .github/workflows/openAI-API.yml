name: OpenAI API

on:
  push:
    branches:
      - main
    paths:
      - "image-gen-api/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image using docker
        run: |
          docker build \
            -t wonchoe/image-gen-api:latest \
            -f image-gen-api/Dockerfile \
            image-gen-api

          docker tag wonchoe/image-gen-api:latest wonchoe/image-gen-api:${{ github.run_number }}

      - name: Push image
        run: |
          docker push wonchoe/image-gen-api:latest
          docker push wonchoe/image-gen-api:${{ github.run_number }}
